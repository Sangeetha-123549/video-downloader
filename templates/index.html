<!DOCTYPE html>
<html>
<head>
    <title>Video Downloader</title>
</head>
<body>

<h2>YouTube Downloader</h2>

<input type="text" id="url" placeholder="Paste YouTube link">
<button onclick="downloadVideo()">Download</button>

<p id="status"></p>

<script>
async function downloadVideo() {

    let url = document.getElementById("url").value;

    if(url === ""){
        alert("Paste YouTube URL");
        return;
    }

    document.getElementById("status").innerText = "Downloading...";

    let response = await fetch("/download", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ url: url })
    });

    let data = await response.json();

    if(data.status === "success"){
        document.getElementById("status").innerText = "Download completed";

        setTimeout(() => {
            window.location.href = "/file?cache=" + new Date().getTime();
        }, 2000);

    } else {
        document.getElementById("status").innerText = "Download failed";
    }
}
</script>

</body>
</html>
