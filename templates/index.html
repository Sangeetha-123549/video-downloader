<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 90%;
    max-width: 400px;
    background: #111827;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

.spinner {
    display: none;
    margin: 15px auto;
    border: 4px solid #333;
    border-top: 4px solid #22c55e;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.progress-container {
    width: 100%;
    background: #374151;
    border-radius: 10px;
    margin-top: 10px;
    display: none;
}

.progress-bar {
    height: 10px;
    width: 0%;
    background: #22c55e;
    border-radius: 10px;
}

.status {
    margin-top: 10px;
    font-size: 14px;
}

.success {
    display: none;
    margin-top: 15px;
    color: #22c55e;
    font-size: 18px;
}

a.download-link {
    display: none;
    margin-top: 15px;
    color: #60a5fa;
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="container">
    <h2>🎬 Video Downloader</h2>

    <input type="text" id="url" placeholder="Paste YouTube URL here">

    <button onclick="startDownload()">Download</button>

    <div class="spinner" id="spinner"></div>

    <div class="progress-container" id="progressBox">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="status" id="status">Ready</div>

    <div class="success" id="success">✅ Download Completed!</div>

    <!-- REAL DOWNLOAD LINK -->
    <a href="/file" class="download-link" id="downloadLink">
        📥 Click here to download video
    </a>

</div>

<script>
function startDownload() {

    let url = document.getElementById("url").value;

    let spinner = document.getElementById("spinner");
    let bar = document.getElementById("bar");
    let progressBox = document.getElementById("progressBox");
    let status = document.getElementById("status");
    let success = document.getElementById("success");
    let downloadLink = document.getElementById("downloadLink");

    spinner.style.display = "block";
    progressBox.style.display = "block";
    success.style.display = "none";
    downloadLink.style.display = "none";
    bar.style.width = "0%";
    status.innerText = "Starting...";

    // call backend
    fetch("/download", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({url: url})
    });

    let progress = 0;

    let interval = setInterval(async () => {

        let res = await fetch("/progress");
        let data = await res.json();

        progress = data.value;
        bar.style.width = progress + "%";
        status.innerText = "Downloading... " + progress + "%";

        if(progress >= 100) {
            clearInterval(interval);

            spinner.style.display = "none";
            success.style.display = "block";
            status.innerText = "Done";

            // REAL DOWNLOAD LINK SHOW
            downloadLink.style.display = "block";
        }

    }, 500);
}
</script>

</body>
</html>
