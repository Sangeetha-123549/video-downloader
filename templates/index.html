<!DOCTYPE html>
<html>
<head>
    <title>YouTube Downloader</title>
    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:100px;
        }
        input{
            width:300px;
            padding:10px;
        }
        button{
            padding:10px 20px;
            margin-top:10px;
        }
    </style>
</head>
<body>

<h1>YouTube Video Downloader</h1>

<form action="/download" method="post">
    <input type="text" name="url" placeholder="Paste YouTube URL" required>
    <br>
    <button type="submit">Download</button>
</form>

</body>
</html>
